[package]
name = "codexwire"
description = "A Rust client for the OpenAI Codex app-server: its JSON-RPC protocol, typed"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/talaagent/codexwire"
authors = ["Ian Macalinao <github@igm.pub>"]
rust-version = "1.85"
publish = false
keywords = ["codex", "openai", "agent", "json-rpc", "sdk"]
categories = ["api-bindings"]
# The schema and its generator stay in the repo: src/protocol.rs is what
# they make, committed.
exclude = ["schema", "scripts"]

# Its own workspace, not a member of an enclosing one.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The client: the child process and its stdio (process, io-util), the
# reader task and response channels (rt, sync), auth.json (fs).
tokio = { version = "1", default-features = false, features = [
    "fs",
    "io-util",
    "process",
    "rt",
    "sync",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = [
    "fs",
    "io-util",
    "process",
    "rt",
    "sync",
    "macros",
    "time",
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
complexity = { level = "deny", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
unwrap_used = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
clone_on_ref_ptr = "deny"
# No lock guard across an await; the blocking calls clippy.toml lists are
# off limits outside tests.
await_holding_lock = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
