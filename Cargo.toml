[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/talaagent/codexwire"
authors = ["Ian Macalinao <github@igm.pub>"]
rust-version = "1.85"

[workspace.dependencies]
codexwire-protocol = { path = "crates/codexwire-protocol", version = "0.1.2" }
base64 = "0.23.1"
jiff = { version = "0.2.39", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false }
tempfile = "3.27.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
complexity = { level = "deny", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
unwrap_used = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
clone_on_ref_ptr = "deny"
# No lock guard across an await; the blocking calls clippy.toml lists are
# off limits outside tests.
await_holding_lock = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
