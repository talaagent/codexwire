name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: "Remove credentials and personal data from logs and examples. Report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands or a small code example, with synthetic input when possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the error message and explain what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: "Crate versions, Rust and Cargo versions, OS, and Codex CLI version."
    validations:
      required: true
